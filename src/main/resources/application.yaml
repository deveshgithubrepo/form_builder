spring:
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  main:
    allow-bean-definition-overriding: true
  application:
    name: formbuilder
  datasource:
    url: ${MYSQL_HOST:jdbc:mysql://127.0.0.1/formbuilder_dev}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driverClassName: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  hikari:
    pool-name: formbuilder-hikari-db-pool
    maximum-pool-size: 20
    minimum-idle: 5
    connection-test-query: SELECT 1
    auto-commit: true
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8090}
  shutdown: graceful
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    max-http-header-size: 65536
  max-http-header-size: 20MB

hibernate:
  validator:
    allow_parameter_constraint_override: true
    allow_multiple_cascaded_validation_on_result: true
    allow_parallel_method_parameter_constraint: true

feign.httpclient.enabled: true

logging:
  config: classpath:logback/logback-spring.xml
  level:
    com.zaxxer.hikari: ERROR
    org.hibernate.engine.jdbc.connections: ERROR

application-config:
  s2s-auth-header: ${S2S_AUTH_HEADER}

feign-config:
  config:
    ums-service:
      host: ${UMS_HOST}
      headers:
        X_AUTHORIZATION: ${UMS_AUTH_HEADER}

    ems-service:
      host: ${EMS_HOST}
      headers:
        X_AUTHORIZATION: ${EMS_AUTH_HEADER}

    notification-service:
      host: ${NOTIFICATION_HOST}
      headers:
        X_AUTHORIZATION: ${NOTIFICATION_AUTH_HEADER}